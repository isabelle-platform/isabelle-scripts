server {
    listen <srv_port>;
    server_name <pub_fqdn>;
    root <root_folder>;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        application/wasm
        application/javascript
        application/json
        text/css
        text/plain
        image/svg+xml;

    location ~ \.(wasm|js|css)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        # Serve the release's precompressed `<file>.br` / `<file>.gz` when
        # there is one; brotli is about a quarter smaller than gzip on the
        # WASM. deploy.sh drops the brotli line on a host without the module.
        brotli_static on;
        gzip_static on;
    }

    location ~ ^\/(?!(api|.*\.wasm$|.*\.png$|.*\.css$|.*\.js$)) {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "must-revalidate, max-age=3600";
    }

    location ^~ /api {
        rewrite            /api/(.*) /$1  break;
        # Must be the IPv4 literal, not `localhost`. On hosts whose /etc/hosts
        # maps `localhost` to ::1 as well as 127.0.0.1, nginx round-robins a
        # bare name across both addresses; the core binds IPv4-only
        # (0.0.0.0:<core_port>), so every connection that lands on [::1] is
        # refused and surfaces as a random "502/connection refused" to the UI
        # — roughly half of all /api calls failed intermittently this way.
        proxy_pass         http://127.0.0.1:<core_port>;
        proxy_redirect     off;
        proxy_set_header   Host $host;
        # nginx proxies as HTTP/1.0 unless told otherwise, and the core answers
        # a POST forwarded that way with "request parse error: invalid Header
        # provided" — a bare 400 with no body, before routing, so it looks like
        # the endpoint is broken rather than the hop in front of it. GETs are
        # unaffected, which is what made it survive this long: /cpe/register,
        # /manufacturing/claim and every other POST through /api were failing
        # while the portal's reads worked.
        proxy_http_version 1.1;
    }

    include /etc/nginx/isabelle/extra-location-*.conf;
}
